<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3Dモデル軽量化</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- Three.js と meshoptimizer はリポジトリに同梱したものを読み込む（CDN は使わない） -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/vendor/three/build/three.module.js",
        "three/addons/": "../../assets/vendor/three/examples/jsm/",
        "meshoptimizer/": "../../assets/vendor/meshoptimizer/"
      }
    }
  </script>
  <style>
    .viewer {
      position: relative;
      width: 100%;
      height: min(50svh, 420px);
      min-height: 240px;
      margin: 12px 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      touch-action: none;
    }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .viewer .label {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      pointer-events: none;
    }
    .status { min-height: 1.6em; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .file-button { position: relative; overflow: hidden; }
    .file-button input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .views { display: inline-grid; grid-template-columns: 1fr 1fr; }
    .views button { border-radius: 0; }
    .views button:first-child { border-radius: 8px 0 0 8px; }
    .views button:last-child { border-radius: 0 8px 8px 0; }
    .views button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .check { display: flex; align-items: center; gap: 6px; }
    .settings {
      display: grid;
      gap: 10px;
      padding: 12px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .settings label { display: grid; gap: 2px; font-size: 0.9rem; }
    .settings .value { color: var(--muted); }
    .settings input[type="range"] { width: 100%; accent-color: var(--accent); }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .presets button { padding: 4px 10px; font-size: 0.85rem; }
    select {
      font: inherit;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
    button:disabled { opacity: 0.45; cursor: default; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 8px 0; }
    th, td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: right; }
    th:first-child, td:first-child { text-align: left; color: var(--muted); font-weight: normal; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>3Dモデル軽量化</h1>
    <p class="muted">3D モデルのポリゴンを減らし、テクスチャを小さくして、軽い .glb に書き出す。積み木やスマホで重いモデルに。</p>
    <div class="viewer" id="viewer"><span class="label" id="view-label"></span></div>
    <p class="status" id="status"></p>

    <div class="row">
      <label class="file-button">
        <button type="button" tabindex="-1">3D モデルを読み込む</button>
        <input type="file" id="file" accept=".glb,.gltf,.obj,.stl">
      </label>
      <div class="views" role="group" aria-label="表示">
        <button data-view="original" aria-pressed="true">元</button>
        <button data-view="lite" aria-pressed="false" disabled>軽量化後</button>
      </div>
      <label class="check"><input type="checkbox" id="wireframe"> ポリゴンを見る</label>
    </div>

    <div class="settings">
      <label>ポリゴンを残す割合 <span class="value" id="ratio-value"></span>
        <input type="range" id="ratio" min="0" max="100" step="1" value="50">
      </label>
      <div class="presets" id="presets">
        <button data-ratio="0.5">50%</button>
        <button data-ratio="0.2">20%</button>
        <button data-ratio="0.1">10%</button>
        <button data-ratio="0.05">5%</button>
        <button data-ratio="0.01">1%</button>
      </div>
      <label>テクスチャの大きさ
        <select id="texture-size"></select>
      </label>
      <div class="row">
        <button class="primary" id="simplify">軽量化する</button>
        <button id="export" disabled>.glb で書き出す</button>
      </div>
    </div>

    <table>
      <thead><tr><th></th><th>元</th><th>軽量化後</th></tr></thead>
      <tbody>
        <tr><td>ポリゴン（三角形）</td><td id="before-triangles">-</td><td id="after-triangles">-</td></tr>
        <tr><td>頂点</td><td id="before-vertices">-</td><td id="after-vertices">-</td></tr>
        <tr><td>テクスチャ</td><td id="before-textures">-</td><td id="after-textures">-</td></tr>
        <tr><td>ファイル</td><td id="before-file">-</td><td id="after-file">-</td></tr>
      </tbody>
    </table>
    <p class="muted">ファイルはこのブラウザの中で処理するだけで、どこにも送信されません。書き出したファイルの大きさは、書き出した後に表示されます。</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
