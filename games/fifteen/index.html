<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15パズル</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: min(100%, 360px);
      aspect-ratio: 1;
      margin: 16px 0;
    }
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 600;
      background: var(--tile);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
    }
    .tile.empty { visibility: hidden; }
    .status { min-height: 1.6em; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>15パズル</h1>
    <p class="muted">空きマスの隣のタイルをクリックして動かし、1〜15 の順に並べよう。</p>
    <div class="board" id="board"></div>
    <p class="status" id="status"></p>
    <button id="reset">シャッフル</button>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
