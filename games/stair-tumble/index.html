<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ラグドール階段落ち</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- Three.js と cannon-es はリポジトリに同梱したものを読み込む（CDN は使わない） -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/vendor/three/build/three.module.js",
        "three/addons/": "../../assets/vendor/three/examples/jsm/",
        "cannon-es": "../../assets/vendor/cannon-es/dist/cannon-es.js"
      }
    }
  </script>
  <style>
    .viewer {
      position: relative;
      width: 100%;
      height: min(62svh, 540px);
      min-height: 320px;
      margin: 12px 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      pointer-events: none;
    }
    .hud span { padding: 2px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); white-space: nowrap; }
    .hit {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--piece-z);
      pointer-events: none;
      text-shadow: 0 0 6px var(--surface), 0 0 12px var(--surface);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 10px;
      text-align: center;
      padding: 16px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
    }
    .overlay[hidden] { display: none; }
    .overlay h2 { margin: 0; font-size: 1.5rem; }
    .overlay p { margin: 0; }
    .overlay button { justify-self: center; padding: 10px 28px; font-size: 1.1rem; font-weight: 700; background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .status { min-height: 1.6em; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row label { display: flex; align-items: center; gap: 6px; }
    .row select { font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: inherit; max-width: 60vw; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>ラグドール階段落ち</h1>
    <p class="muted">キャラクターを階段の上から突き落として、ぶつかった強さで点を稼ぐ。頭をぶつけると 3 倍。</p>
    <div class="viewer" id="viewer">
      <div class="hud"><span id="score">0 点</span><span id="best">ベスト 0</span></div>
      <div class="hit" id="hit"></div>
      <div class="overlay" id="overlay" hidden>
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <button id="again">もう一回</button>
      </div>
    </div>
    <p class="status" id="status">キャラクターの押したい所から、指で引っぱって離すと突き飛ばす。</p>
    <div class="row">
      <label>キャラクター <select id="character"></select></label>
      <button id="reset">置き直す</button>
    </div>
    <p class="muted">引っぱった長さが強さ、向きが押す向き。頭を押すと倒れ込み、足を押すと足をすくわれる。</p>
    <p class="muted">キャラクターは<a href="../character-room/">キャラクター管理室</a>に保存したものから選べる。体は頭・胸・腰・うで・あしに分けて、関節でつないでいる（人の形でないモデルも、それなりに分ける）。</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
