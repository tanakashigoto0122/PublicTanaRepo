<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巨大化パニック</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- Three.js と cannon-es はリポジトリに同梱したものを読み込む（CDN は使わない） -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/vendor/three/build/three.module.js",
        "three/addons/": "../../assets/vendor/three/examples/jsm/",
        "cannon-es": "../../assets/vendor/cannon-es/dist/cannon-es.js"
      }
    }
  </script>
  <style>
    .viewer {
      position: relative;
      width: 100%;
      height: min(68svh, 560px);
      min-height: 320px;
      margin: 12px 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      /* 指での操作をページのスクロールやズームに取られないようにする */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      pointer-events: none;
    }
    .hud span {
      padding: 2px 10px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .stick {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--bg) 70%, transparent);
      border: 2px solid var(--border);
    }
    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.85;
      pointer-events: none;
    }
    .actions { position: absolute; right: 16px; bottom: 16px; display: grid; gap: 10px; justify-items: end; }
    .actions button {
      border-radius: 50%;
      padding: 0;
      font-weight: 700;
      touch-action: none;
    }
    .actions .stomp { width: 88px; height: 88px; background: var(--piece-z); border-color: var(--piece-z); color: var(--surface); font-size: 1.1rem; }
    .actions .stomp:disabled { opacity: 0.5; }
    .grow {
      position: absolute; top: 44px; left: 0; right: 0; text-align: center; font-size: 1.5rem; font-weight: 800;
      color: var(--piece-z); pointer-events: none; text-shadow: 0 0 6px var(--surface), 0 0 12px var(--surface);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      text-align: center;
      padding: 16px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
    }
    .overlay[hidden] { display: none; }
    .overlay h2 { margin: 0; font-size: 1.4rem; }
    .overlay p { margin: 0; }
    .overlay button { justify-self: center; padding: 10px 28px; font-size: 1.1rem; font-weight: 700; background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row select { font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: inherit; max-width: 60vw; }
    .status { min-height: 1.6em; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>巨大化パニック</h1>
    <p class="muted">巨大なキャラクターになって、60 秒で箱のビル街をなぎ倒そう。たくさん壊すほど、どんどん大きくなる。</p>
    <div class="viewer" id="viewer">
      <div class="hud"><span id="time">60.0</span><span id="score">0 個</span><span id="size">身長 3</span><span id="best">ベスト 0</span></div>
      <div class="grow" id="grow"></div>
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <div class="actions">
        <button class="stomp" id="stomp">ドスン</button>
      </div>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">巨大化パニック</h2>
        <p id="overlay-text">左下のスティックで歩いて体当たり、右下の「ドスン」で足踏みして、まわりのビルを揺らして崩す。</p>
        <button id="start">スタート</button>
      </div>
    </div>
    <p class="status" id="status"></p>
    <div class="row">
      <label>キャラクター <select id="character"></select></label>
    </div>
    <p class="muted">キーボード：W A S D か矢印キーで歩く、スペースでドスン。</p>
    <p class="muted">50 個倒すごとに身長が 1 伸びて、歩幅もドスンの範囲も大きくなる（身長 9 まで）。</p>
    <p class="muted">キャラクターは<a href="../character-room/">キャラクター管理室</a>に保存したものから選べる。</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
