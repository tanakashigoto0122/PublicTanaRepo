<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ドミノ倒し</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- Three.js と cannon-es はリポジトリに同梱したものを読み込む（CDN は使わない） -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/vendor/three/build/three.module.js",
        "three/addons/": "../../assets/vendor/three/examples/jsm/",
        "cannon-es": "../../assets/vendor/cannon-es/dist/cannon-es.js"
      }
    }
  </script>
  <style>
    .viewer {
      width: 100%;
      height: min(58svh, 480px);
      min-height: 260px;
      margin: 12px 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      /* 指でなぞる操作をページのスクロールやズームに取られないようにする */
      touch-action: none;
    }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .status { min-height: 1.6em; margin: 0 0 8px; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .modes { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1 1 100%; }
    .modes button { border-radius: 0; }
    .modes button:first-child { border-radius: 8px 0 0 8px; }
    .modes button:last-child { border-radius: 0 8px 8px 0; }
    .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
    .hint { font-size: 0.85rem; margin: 0 0 8px; }
    select {
      font: inherit;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .spacing { display: grid; gap: 2px; flex: 1 1 100%; font-size: 0.9rem; }
    .spacing input { width: 100%; accent-color: var(--accent); }
    .spacing .value { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>ドミノ倒し</h1>
    <p class="muted">床を指でなぞるとドミノが並ぶ。「倒す」で連鎖スタート！ 全部倒せるかな？</p>
    <div class="viewer" id="viewer"></div>
    <p class="status" id="status"></p>

    <div class="row">
      <button class="primary" id="topple">倒す</button>
      <button id="reset">起こす</button>
      <button id="undo">1 本もどす</button>
      <button id="clear">全部消す</button>
    </div>
    <div class="row">
      <div class="modes" role="group" aria-label="なぞる・タップしたときの動作">
        <button data-mode="draw" aria-pressed="true">描く</button>
        <button data-mode="push" aria-pressed="false">押す</button>
        <button data-mode="erase" aria-pressed="false">消す</button>
      </div>
    </div>
    <p class="hint muted" id="hint"></p>
    <div class="row">
      <label class="spacing">ドミノの間隔 <span class="value" id="spacing-value"></span>
        <input type="range" id="spacing" min="0.3" max="0.9" step="0.05" value="0.45">
      </label>
    </div>
    <div class="row">
      <select id="sample" aria-label="お手本">
        <option value="spiral">うずまき</option>
        <option value="heart">ハート</option>
        <option value="zigzag">つづら折り</option>
      </select>
      <button id="place-sample">お手本を並べる</button>
      <button id="reset-view">視点を戻す</button>
    </div>
    <p class="muted" id="counts"></p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
