<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ぷるぷるラボ</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- Three.js はリポジトリに同梱したものを読み込む（CDN は使わない） -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/vendor/three/build/three.module.js",
        "three/addons/": "../../assets/vendor/three/examples/jsm/"
      }
    }
  </script>
  <style>
    .viewer {
      width: 100%;
      height: min(60svh, 520px);
      min-height: 300px;
      margin: 12px 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .status { min-height: 1.6em; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
    .settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px 16px;
      padding: 12px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .settings label { display: grid; gap: 2px; font-size: 0.9rem; }
    .settings .value { color: var(--muted); }
    .settings input[type="range"] { width: 100%; accent-color: var(--accent); }
    .file-button { position: relative; overflow: hidden; }
    .file-button input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>ぷるぷるラボ</h1>
    <p class="muted">3D モデルがゼリーのような柔らかい体になる。つかんで引っぱったり、振り回して投げたり、高い所から落としたりしてみよう。何もないところのドラッグで視点が回る。</p>
    <div class="viewer" id="viewer"></div>
    <p class="status" id="status"></p>

    <div class="row">
      <button class="primary" id="drop">持ち上げて落とす</button>
      <button id="jump">ジャンプ</button>
      <button id="reset">元に戻す</button>
    </div>
    <div class="settings">
      <label>やわらかさ <span class="value" id="softness-value"></span><input type="range" id="softness" min="0" max="100" value="55"></label>
      <label>弾み <span class="value" id="bounce-value"></span><input type="range" id="bounce" min="0" max="90" value="30"></label>
    </div>

    <h2>モデル</h2>
    <div class="row">
      <label class="file-button">
        <button type="button" tabindex="-1">3D モデルを読み込む</button>
        <input type="file" id="file" accept=".glb,.gltf,.obj,.stl">
      </label>
      <button id="use-character">キャラクターを使う</button>
      <button id="clay">粘土の玉</button>
    </div>
    <p class="muted">最初は、メカ・ブラスターなどと共通のキャラクター（なければ粘土の玉）が出ます。モデルはこのブラウザの中だけで扱い、どこにも送信しません。ここでの変形は保存されません。細かすぎるモデルは「3Dモデル軽量化」で軽くしてからのほうが、なめらかに動きます。</p>
    <p class="muted"><a href="../character-room/">キャラクター管理室</a>で、保存したキャラクターを切り替えたり、名前や向きを直したりできます。</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
