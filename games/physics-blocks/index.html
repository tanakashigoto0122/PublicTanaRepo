<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物理積み木</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- Three.js と cannon-es はリポジトリに同梱したものを読み込む（CDN は使わない） -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/vendor/three/build/three.module.js",
        "three/addons/": "../../assets/vendor/three/examples/jsm/",
        "cannon-es": "../../assets/vendor/cannon-es/dist/cannon-es.js"
      }
    }
  </script>
  <style>
    .viewer {
      width: 100%;
      height: min(55svh, 460px);
      min-height: 260px;
      margin: 12px 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      /* 指での操作をページのスクロールやズームに取られないようにする */
      touch-action: none;
    }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .status { min-height: 1.6em; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row select { flex: 1 1 120px; min-width: 0; }
    select {
      font: inherit;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .modes { display: grid; grid-template-columns: repeat(4, 1fr); flex: 1 1 100%; }
    .modes button { border-radius: 0; padding: 8px 2px; font-size: 0.9rem; white-space: nowrap; }
    .modes button:first-child { border-radius: 8px 0 0 8px; }
    .modes button:last-child { border-radius: 0 8px 8px 0; }
    .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .swatch {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .swatch[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
    .swatch[data-color="--piece-z"] { background: var(--piece-z); }
    .swatch[data-color="--piece-l"] { background: var(--piece-l); }
    .swatch[data-color="--piece-o"] { background: var(--piece-o); }
    .swatch[data-color="--piece-s"] { background: var(--piece-s); }
    .swatch[data-color="--piece-i"] { background: var(--piece-i); }
    .swatch[data-color="--piece-j"] { background: var(--piece-j); }
    .swatch[data-color="--piece-t"] { background: var(--piece-t); }
    .swatch[data-color="random"] {
      background: conic-gradient(var(--piece-z), var(--piece-o), var(--piece-s), var(--piece-i), var(--piece-t), var(--piece-z));
    }
    .check { display: flex; align-items: center; gap: 6px; }
    .settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px 16px;
      padding: 12px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .settings label { display: grid; gap: 2px; font-size: 0.9rem; }
    .settings .value { color: var(--muted); }
    .settings input[type="range"] { width: 100%; accent-color: var(--accent); }
    .hint { font-size: 0.85rem; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>物理積み木</h1>
    <p class="muted">物体をドラッグするとつかんで動かせる。何もないところをドラッグすると視点が回る。下のモードを選んでからタップしよう。</p>
    <div class="viewer" id="viewer"></div>
    <p class="status" id="status"></p>

    <div class="row">
      <div class="modes" role="group" aria-label="タップしたときの動作">
        <button data-mode="place" aria-pressed="true">置く</button>
        <button data-mode="glue" aria-pressed="false">くっつける</button>
        <button data-mode="unglue" aria-pressed="false">はがす</button>
        <button data-mode="remove" aria-pressed="false">消す</button>
      </div>
    </div>
    <p class="hint muted" id="hint"></p>
    <div class="row">
      <select id="kind" aria-label="置く形">
        <option value="box">箱</option>
        <option value="plank">板</option>
        <option value="pillar">柱</option>
        <option value="sphere">球</option>
        <option value="cylinder">円柱</option>
      </select>
      <button id="pause">一時停止</button>
    </div>
    <div class="row" id="colors" aria-label="色">
      <button class="swatch" data-color="random" aria-label="おまかせ" aria-pressed="true"></button>
      <button class="swatch" data-color="--piece-z" aria-label="赤" aria-pressed="false"></button>
      <button class="swatch" data-color="--piece-l" aria-label="オレンジ" aria-pressed="false"></button>
      <button class="swatch" data-color="--piece-o" aria-label="黄" aria-pressed="false"></button>
      <button class="swatch" data-color="--piece-s" aria-label="緑" aria-pressed="false"></button>
      <button class="swatch" data-color="--piece-i" aria-label="水色" aria-pressed="false"></button>
      <button class="swatch" data-color="--piece-j" aria-label="青" aria-pressed="false"></button>
      <button class="swatch" data-color="--piece-t" aria-label="紫" aria-pressed="false"></button>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="auto-glue"> 置いたら着地した相手とくっつく</label>
    </div>
    <div class="row">
      <button id="glue-all">触れているもの全部くっつける</button>
    </div>

    <div class="settings">
      <label>硬さ <span class="value" id="stiffness-value"></span><input type="range" id="stiffness" min="0" max="100" value="80"></label>
      <label>接着の強さ <span class="value" id="strength-value"></span><input type="range" id="strength" min="0" max="100" value="100"></label>
      <label>弾み <span class="value" id="bounce-value"></span><input type="range" id="bounce" min="0" max="100" value="10"></label>
      <label>重力 <span class="value" id="gravity-value"></span><input type="range" id="gravity" min="0" max="200" value="100"></label>
    </div>

    <div class="row">
      <button id="sample">お手本の門を置く</button>
      <button id="reset-view">視点を戻す</button>
      <button id="clear">全部消す</button>
    </div>
    <p class="muted" id="counts"></p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
