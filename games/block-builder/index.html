<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D積み木</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- Three.js はリポジトリに同梱したものを読み込む（CDN は使わない） -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/vendor/three/build/three.module.js",
        "three/addons/": "../../assets/vendor/three/examples/jsm/"
      }
    }
  </script>
  <style>
    .viewer {
      width: 100%;
      height: min(55svh, 460px);
      min-height: 260px;
      margin: 12px 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      /* 指での操作をページのスクロールやズームに取られないようにする */
      touch-action: none;
    }
    .viewer canvas { display: block; width: 100%; height: 100%; }
    .status { min-height: 1.6em; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row select { flex: 1 1 120px; min-width: 0; }
    select {
      font: inherit;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    button:disabled { opacity: 0.45; cursor: default; }
    button:disabled:hover { border-color: var(--border); }
    .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; flex: 1 1 100%; }
    .modes button { border-radius: 0; }
    .modes button:first-child { border-radius: 8px 0 0 8px; }
    .modes button:last-child { border-radius: 0 8px 8px 0; }
    .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .colors { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .swatch {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid var(--border);
    }
    .swatch[data-color="--piece-i"] { background: var(--piece-i); }
    .swatch[data-color="--piece-o"] { background: var(--piece-o); }
    .swatch[data-color="--piece-t"] { background: var(--piece-t); }
    .swatch[data-color="--piece-s"] { background: var(--piece-s); }
    .swatch[data-color="--piece-z"] { background: var(--piece-z); }
    .swatch[data-color="--piece-j"] { background: var(--piece-j); }
    .swatch[data-color="--piece-l"] { background: var(--piece-l); }
    .swatch[data-color="--surface"] { background: var(--surface); }
    .swatch[data-color="--text"] { background: var(--text); }
    input[type="color"] { width: 44px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; }
    .check { display: flex; align-items: center; gap: 6px; }
    .info {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 12px;
      margin: 12px 0 0;
      font-size: 0.9rem;
    }
    .info dt { color: var(--muted); }
    .info dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← ゲーム一覧</a></p>
    <h1>3D積み木</h1>
    <p class="muted">形を追加して、タップで選ぶ。出てきた矢印や輪をドラッグすると、動かす・大きさを変える・回すができる。何もないところをドラッグすると視点が回る。</p>
    <div class="viewer" id="viewer"></div>
    <p class="status" id="status"></p>

    <div class="row">
      <select id="kind" aria-label="追加する形">
        <option value="box">箱</option>
        <option value="sphere">球</option>
        <option value="cylinder">円柱</option>
        <option value="cone">円すい</option>
        <option value="torus">ドーナツ</option>
      </select>
      <button id="add">＋ 追加</button>
    </div>
    <div class="row">
      <div class="modes" role="group" aria-label="操作">
        <button data-mode="translate" aria-pressed="true">移動</button>
        <button data-mode="scale" aria-pressed="false">大きさ</button>
        <button data-mode="rotate" aria-pressed="false">回転</button>
      </div>
    </div>
    <div class="row">
      <span>全体の大きさ</span>
      <button id="shrink" aria-label="小さくする">－</button>
      <button id="grow" aria-label="大きくする">＋</button>
    </div>
    <div class="row colors" id="colors" aria-label="色">
      <button class="swatch" data-color="--piece-z" aria-label="赤"></button>
      <button class="swatch" data-color="--piece-l" aria-label="オレンジ"></button>
      <button class="swatch" data-color="--piece-o" aria-label="黄"></button>
      <button class="swatch" data-color="--piece-s" aria-label="緑"></button>
      <button class="swatch" data-color="--piece-i" aria-label="水色"></button>
      <button class="swatch" data-color="--piece-j" aria-label="青"></button>
      <button class="swatch" data-color="--piece-t" aria-label="紫"></button>
      <button class="swatch" data-color="--surface" aria-label="白"></button>
      <button class="swatch" data-color="--text" aria-label="黒"></button>
      <input type="color" id="color" aria-label="好きな色">
    </div>
    <div class="row">
      <button id="duplicate">複製</button>
      <button id="delete">削除</button>
      <button id="undo">元に戻す</button>
      <button id="redo">やり直す</button>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="snap" checked> マス目にそろえる</label>
    </div>
    <div class="row">
      <button id="reset-view">視点を戻す</button>
      <button id="export">.glb で書き出す</button>
      <button id="clear">全部消す</button>
    </div>

    <dl class="info">
      <dt>選択中</dt><dd id="info-name">なし</dd>
      <dt>位置</dt><dd id="info-position">-</dd>
      <dt>大きさ</dt><dd id="info-scale">-</dd>
      <dt>回転</dt><dd id="info-rotation">-</dd>
      <dt>形の数</dt><dd id="info-count">0</dd>
    </dl>
    <p class="muted">作品はこのブラウザの中に自動で保存されます。書き出した .glb は「3Dビューア」でも開けます。</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
