<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D展示ステージ</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    main { max-width: 1000px; }
    .intro { margin-top: 4px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; }
    #viewer { height: 460px; min-width: 0; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    aside { padding: 18px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
    label { display: block; margin-bottom: 18px; }
    select, input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
    input[type=range] { padding: 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    #capture { background: var(--accent); color: var(--surface); }
    h2 { font-size: 1rem; }
    #status { min-height: 1.6em; }
    @media(max-width: 650px) { .layout { grid-template-columns: minmax(0, 1fr); } #viewer { height: 340px; } }
  </style>
  <script type="importmap">{"imports":{"three":"../../assets/vendor/three/build/three.module.js","three/addons/":"../../assets/vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main>
    <a href="../../">← ゲーム一覧</a>
    <h1>3D展示ステージ</h1>
    <p class="intro">作ったキャラクターを、くるくる回る小さな展覧会に。好きな角度で写真も撮れます。</p>
    <div class="layout">
      <div id="viewer" aria-label="3D作品の展示。ドラッグで視点を変更"></div>
      <aside>
        <label>展示する作品<select id="character"><option value="">お手本の積み木ロボ</option></select></label>
        <button id="refresh">保存した作品を再読み込み</button>
        <label style="margin-top:18px">作品ファイルを開く<input id="file" type="file" accept=".glb,.gltf,.obj,.stl"></label>
        <label>回転の速さ <output id="speed-value">3</output> 回/分<input id="speed" type="range" min="0" max="12" value="3"></label>
        <label>ステージの色<select id="palette"><option value="--piece-j">青</option><option value="--piece-l">オレンジ</option><option value="--piece-t">紫</option><option value="--piece-s">緑</option></select></label>
        <div class="actions"><button id="pause" aria-pressed="false">回転を止める</button><button id="reset">視点を戻す</button><button id="capture">写真を保存</button></div>
      </aside>
    </div>
    <p id="status" role="status" aria-live="polite">お手本を展示しています。</p>
    <h2>ほかのツールで作った作品を飾ろう</h2>
    <p><a href="../character-room/">キャラクター管理室</a>に保存した作品を選べます。<a href="../block-builder/">3D積み木</a>や<a href="../model-sculpt/">ぐにゃぐにゃ工房</a>で書き出したモデルも開けます。</p>
    <p class="muted">ドラッグで回す・ピンチで拡大。写真は展示画面だけのPNGです。作品や写真は送信しません。保存済みキャラクターの選択・名前・形は変更しません。外部ファイルを参照する gltf は、単体の glb にまとめてから開いてください。</p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
