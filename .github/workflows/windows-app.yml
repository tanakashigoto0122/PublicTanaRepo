name: Windows app

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[app]" "pyinstaller>=6.22,<7"

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TripoModelManager
          --collect-data tripo_export
          packaging/windows/app_entry.py

      # The exe has no console, so each check writes its result to a file.
      - name: Self-test the exe (imports, bundled viewer, local server)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $p = Start-Process -FilePath dist\TripoModelManager.exe -ArgumentList "--self-test", $report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Open the real window once (WebView2)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "window.txt"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "appdata"
          $p = Start-Process -FilePath dist\TripoModelManager.exe -ArgumentList "--smoke-window", $report -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "window did not close within 2 minutes"; exit 1 }
          Get-Content $report
          if ((Get-Content $report -Raw).Trim() -ne "OK") { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: TripoModelManager-windows
          path: dist/TripoModelManager.exe
          if-no-files-found: error
